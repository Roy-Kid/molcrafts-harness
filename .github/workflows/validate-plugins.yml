name: Validate plugins

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Claude Code and Codex plugin metadata
        run: python3 scripts/validate_repository.py

      - name: Run structural unit tests
        run: |
          python3 tests/test_model_policy.py
          python3 tests/test_project_blueprint_mechanism.py
          python3 tests/test_git_publish.py
